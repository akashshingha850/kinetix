[project]
name = "kinetix"
version = "0.0.0"
description = "Adaptive next-best-view photogrammetry for indoor objects with a monocular drone"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pyyaml>=6.0",
  "opencv-python-headless>=4.10",
  "pycolmap>=3.12",          # SfM backend (CPU wheels; incremental mapping, triangulation, BA)
  "open3d>=0.19",            # raycasting (coverage oracle), TSDF, Chamfer / F-score
  "trimesh>=4.4",            # mesh I/O and sampling for ground truth
]

[project.optional-dependencies]
ml = [
  "torch>=2.7",
  "torchvision>=0.22",
  "transformers>=4.45",      # Depth Anything V2 via the HF hub
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false              # no package yet (docs/roadmap.md K1 adds src/kinetix)

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "t0: offline, pool replay (no sim)",
  "t1: needs Isaac render-on-demand",
  "t2: needs the full bisg_isaac flight stack",
  "t3: real drone",
  "gpu: needs a CUDA device",
]
